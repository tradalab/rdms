name: Build & Push Web Image

on:
  push:
    tags: [ 'v*' ]
  # A tag push is the normal route. The manual one exists because a release whose
  # image failed to build cannot be rebuilt otherwise: its tag points at the very
  # commit that could not build, so re-running the tag build repeats the failure.
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish (blank = derive from the ref: v1.15.1 -> 1.15.1)'
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build vars
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"   # v1.12.0 -> 1.12.0
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile_web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ github.repository }}:latest
