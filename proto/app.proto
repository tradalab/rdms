syntax = "proto3";

package rdms;

message Empty {}

message ConnectionReq {
  string id                 = 1;
  string mode               = 2;
  string name               = 3;
  string network            = 4;
  string host               = 5;
  int32  port               = 6;
  string addrs              = 7;
  string sentinel_master    = 8;
  string sentinel_username  = 9;
  string sentinel_password  = 10;
  string sock               = 11;
  string username           = 12;
  string password           = 13;
  string addr_mapping       = 14;
  int64  exec_timeout       = 15;
  int64  dial_timeout       = 16;
  int64  key_size           = 17;
  bool   ssh_enable         = 18;
  string ssh_id             = 19;
  bool   proxy_enable       = 20;
  string proxy_id           = 21;
  bool   tls_enable         = 22;
  string tls_id             = 23;
  SshReq ssh                = 24;
  ProxyReq proxy            = 25;
  TlsReq tls                = 26;
  string group_id           = 27;
  int32  last_db            = 28;
  bool   read_only          = 29;
}

message SshReq {
  string id          = 1;
  string host        = 2;
  int32  port        = 3;
  string username    = 4;
  string kind        = 5;
  string password    = 6;
  string private_key = 7;
  string passphrase  = 8;
  int64  timeout     = 9;
}

message TlsReq {
  string id          = 1;
  string name        = 2;
  bool   use_sni     = 3;
  string server_name = 4;
  bool   verify      = 5;
  bool   client_auth = 6;
  string ca_cert     = 7;
  string cert        = 8;
  string key         = 9;
}

message ProxyReq {
  string id       = 1;
  string protocol = 2;
  string host     = 3;
  int32  port     = 4;
  string username = 5;
  string password = 6;
}

message ClientConnectReq {
  string connection_id  = 1;
  int32  database_index = 2;
}

message ClientSetReadOnlyReq {
  string connection_id  = 1;
  int32  database_index = 2;
  bool   read_only      = 3;
}

message ClientDisconnectReq {
  string connection_id = 1;
  int32  database_index = 2;
}

message ClientGeneralReq {
  string connection_id  = 1;
  int32  database_index = 2;
}

message ClientGeneralRes {
  string      info      = 1;
  int32       total_db  = 2;
  repeated DBInfo databases = 3;
}

message DBInfo {
  int32  index   = 1;
  string name    = 2;
  int32  keys    = 3;
  int32  expires = 4;
  int64  avg_ttl = 5;
}

message ClientGetSlowQueryReq {
  string connection_id  = 1;
  int32  database_index = 2;
}

message ClientLoadAllKeysReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string prefix         = 3;
  int64  count          = 4;
  string cursor         = 5;
}

message ClientLoadAllKeysRes {
  repeated string keys   = 1;
  string          cursor = 2;
}

message ClientLoadKeyDetailReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
}

message ClientLoadKeyValuePageReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string kind           = 4;
  string cursor         = 5;
  int64  page_size      = 6;
}

message ClientKeyCreateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string kind           = 4;
  int64  ttl            = 5;
  string value_string   = 6;
  string value_json     = 7;
  repeated string value_list = 8;
  repeated KeyValue value_hash = 9;
  repeated string value_set = 10;
  repeated ZMember value_zset = 11;
  StreamValue value_stream = 12;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message ZMember {
  string member = 1;
  double score = 2;
}

message StreamValue {
  string id = 1;
  string values = 2;
}

message ClientKeyDeleteReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
}

message ClientKeyNameUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string current_name   = 3;
  string new_name       = 4;
}

message ClientKeyTtlUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key_name       = 3;
  int64  key_ttl        = 4;
}

message ClientKeyValueUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string kind           = 4;
  string value          = 5;
}

message ClientKeysMetadataReq {
  string          connection_id  = 1;
  int32           database_index = 2;
  repeated string keys           = 3;
}

message ClientKeysDeleteByPrefixReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string prefix         = 3;
  repeated string keys  = 4;
}

message ClientSearchKeysReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string prefix         = 3;
  int64  count          = 4;
  string cursor         = 5;
}

message KeyFilter {
  string pattern     = 1;
  string mode        = 2;
  bool   exclude     = 3;
  bool   ignore_case = 4;
}

message ClientKeysSearchReq {
  string   connection_id  = 1;
  int32    database_index = 2;
  repeated KeyFilter filters = 3;
  bool     match_all      = 4;
  string   key_type       = 5;
  int64    scan_count     = 6;
  int64    limit          = 7;
  string   cursor         = 8;
  int64    budget_ms      = 9;
}

message SearchPresetItem {
  string   id         = 1;
  string   name       = 2;
  repeated KeyFilter filters = 3;
  bool     match_all  = 4;
  string   key_type   = 5;
  int64    created_at = 6;
  int64    updated_at = 7;
}

message SearchPresetListRes {
  repeated SearchPresetItem items = 1;
}

message SearchPresetUpsertReq {
  string   id        = 1;
  string   name      = 2;
  repeated KeyFilter filters = 3;
  bool     match_all = 4;
  string   key_type  = 5;
}

message ClientKeysSearchEvent {
  repeated string keys      = 1;
  uint64          scanned   = 2;
  uint64          matched   = 3;
  string          cursor    = 4;
  bool            done      = 5;
  bool            truncated = 6;
}
message ClientSearchKeysRes {
  repeated string keys = 1;
}

message ClientGetSlowQueryRes {
  repeated SlowQueryItem items = 1;
}

message SlowQueryItem {
  int64           id          = 1;
  int64           timestamp   = 2;
  int64           duration    = 3;
  repeated string command     = 4;
  string          client_addr = 5;
  string          client_name = 6;
}

message ClientLoadKeyDetailRes {
  string key      = 1;
  string value    = 2;
  string kind     = 3;
  double ttl      = 4;
  int64  total    = 5;
  string encoding = 6;
  int64  size     = 7;
}

message ClientLoadKeyValuePageRes {
  repeated KeyValuePageItem items = 1;
  string next_cursor = 2;
  bool   has_more    = 3;
}

message KeyValuePageItem {
  string field  = 1;
  string value  = 2;
  int64  index  = 3;
  string member = 4;
  double score  = 5;
  string id     = 6;
}

message ClientKeysMetadataRes {
  repeated KeyMetadata items = 1;
}

message KeyMetadata {
  string key  = 1;
  string type = 2;
  int64  ttl  = 3;
  int64  size = 4;
}

message ClientKeysDeleteByPrefixRes {
  int32 total_deleted = 1;
}

message ClientKeysScanByPrefixRes {
  repeated string keys = 1;
  string next_cursor   = 2;
}

message KeyLoadRes {
  repeated string keys = 1;
  string cursor        = 2;
}

message MonitorStatusRes {
  bool active = 1;
}

message SystemInfoRes {
  string version = 1;
  string os      = 2;
  string arch    = 3;
  string runtime = 4;
}

message ConnectionListRes {
  repeated ConnectionReq items = 1;
}

message SshListRes {
  repeated SshReq items = 1;
}

message ProxyListRes {
  repeated ProxyReq items = 1;
}

message TlsListRes {
  repeated TlsReq items = 1;
}

message GroupListRes {
  repeated GroupItem items = 1;
}

message GroupItem {
  string id         = 1;
  string name       = 2;
  int64  created_at = 3;
  int64  updated_at = 4;
}

message GroupUpsertReq {
  string id   = 1;
  string name = 2;
}

message SettingListRes {
  repeated SettingItem items = 1;
}

message SettingItem {
  string key   = 1;
  string value = 2;
}

message SettingSetReq {
  string key   = 1;
  string value = 2;
}

message SettingGetReq {
  string key = 1;
}

message SettingGetRes {
  string value = 1;
}

message IdReq {
  string id = 1;
}

message UpsertRes {
  string id = 1;
}

message KeyHashFieldDelReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string field          = 4;
}

message KeyListItemDelReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  int64  index          = 4;
  string value          = 5;
}

message KeyLoadReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string cursor         = 4;
  int64  count          = 5;
}

message KeySetMemberDelReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string member         = 4;
}

message KeyStreamEntryDelReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string entry_id       = 4;
}

message KeyZSetMemberDelReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string member         = 4;
}

message KeyHashFieldUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string field          = 4; // current field name (identity)
  string new_field      = 5; // new field name (== field when unchanged)
  string value          = 6;
}

message KeyListItemUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  int64  index          = 4;
  string old_value      = 5; // optimistic guard against concurrent edits
  string value          = 6; // new value
}

message KeySetMemberUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string member         = 4; // current member
  string new_member     = 5; // new member value (rename)
}

message KeyZSetMemberUpdateReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string key            = 3;
  string member         = 4; // current member (identity)
  string new_member     = 5; // new member (== member when unchanged)
  double score          = 6;
}

message MonitorReq {
  string connection_id  = 1;
  int32  database_index = 2;
}

message PubSubSubscribeReq {
  string connection_id  = 1;
  int32  database_index = 2;
  repeated string channels = 3;
}
message PubSubStreamReq {
  string connection_id  = 1;
  int32  database_index = 2;
}

message PubSubPublishReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string channel        = 3;
  string message        = 4;
}

message MonitorMessageEvent {
  string connection_id = 1;
  string line          = 2;
}

message MonitorStatusEvent {
  string connection_id = 1;
  bool   active        = 2;
}
message MonitorFrame {
  string kind          = 1; // "status" | "message"
  string connection_id = 2;
  bool   active        = 3; // when kind == "status"
  string line          = 4; // when kind == "message"
}

message PubsubMessageEvent {
  string connection_id = 1;
  string channel       = 2;
  string message       = 3;
  string pattern       = 4;
}

message ClientKeysDeleteProgressEvent {
  string connection_id = 1;
  string prefix        = 2;
  int64  deleted       = 3;
  int64  total         = 4;
  string status        = 5; // processing | done
}

message ConsoleInputEvent {
  string connection_id  = 1;
  int32  database_index = 2;
  string id             = 3;
  string command        = 4;
}

message ConsoleOutputEvent {
  string connection_id = 1;
  string id            = 2;
  string stdout        = 3;
  string stderr        = 4;
}

service client {
  rpc Connect(ClientConnectReq) returns (Empty);
  rpc ConsoleConnect(ClientConnectReq) returns (Empty);
  rpc Disconnect(ClientDisconnectReq) returns (Empty);
  rpc General(ClientGeneralReq) returns (ClientGeneralRes);
  rpc GetSlowQuery(ClientGetSlowQueryReq) returns (ClientGetSlowQueryRes);
  rpc LoadAllKeys(ClientLoadAllKeysReq) returns (ClientLoadAllKeysRes);
  rpc LoadKeyDetail(ClientLoadKeyDetailReq) returns (ClientLoadKeyDetailRes);
  rpc LoadKeyValuePage(ClientLoadKeyValuePageReq) returns (ClientLoadKeyValuePageRes);
  rpc KeyCreate(ClientKeyCreateReq) returns (Empty);
  rpc KeyDelete(ClientKeyDeleteReq) returns (Empty);
  rpc KeyNameUpdate(ClientKeyNameUpdateReq) returns (Empty);
  rpc KeyTtlUpdate(ClientKeyTtlUpdateReq) returns (Empty);
  rpc KeyValueUpdate(ClientKeyValueUpdateReq) returns (Empty);
  rpc KeysMetadata(ClientKeysMetadataReq) returns (ClientKeysMetadataRes);
  rpc KeysDeleteByPrefix(ClientKeysDeleteByPrefixReq) returns (stream ClientKeysDeleteProgressEvent);
  rpc KeysScanByPrefix(ClientKeysDeleteByPrefixReq) returns (ClientKeysScanByPrefixRes);
  rpc KeysSearch(ClientKeysSearchReq) returns (stream ClientKeysSearchEvent);
  rpc SearchKeys(ClientSearchKeysReq) returns (ClientSearchKeysRes);
  rpc SetReadOnly(ClientSetReadOnlyReq) returns (Empty);
}

service conn {
  rpc Test(ConnectionReq) returns (Empty);
}

service preset {
  rpc List(Empty) returns (SearchPresetListRes);
  rpc Upsert(SearchPresetUpsertReq) returns (UpsertRes);
  rpc Delete(IdReq) returns (Empty);
}

service key {
  rpc HashFieldDel(KeyHashFieldDelReq) returns (Empty);
  rpc HashFieldUpdate(KeyHashFieldUpdateReq) returns (Empty);
  rpc ListItemDel(KeyListItemDelReq) returns (Empty);
  rpc ListItemUpdate(KeyListItemUpdateReq) returns (Empty);
  rpc Load(KeyLoadReq) returns (KeyLoadRes);
  rpc SetMemberDel(KeySetMemberDelReq) returns (Empty);
  rpc SetMemberUpdate(KeySetMemberUpdateReq) returns (Empty);
  rpc StreamEntryDel(KeyStreamEntryDelReq) returns (Empty);
  rpc ZSetMemberDel(KeyZSetMemberDelReq) returns (Empty);
  rpc ZSetMemberUpdate(KeyZSetMemberUpdateReq) returns (Empty);
}

service monitor {
  rpc Start(MonitorReq) returns (stream MonitorFrame);
  rpc Stop(MonitorReq) returns (Empty);
  rpc Status(MonitorReq) returns (MonitorStatusRes);
}

service pubsub {
  rpc Stream(PubSubStreamReq) returns (stream PubsubMessageEvent);
  rpc Subscribe(PubSubSubscribeReq) returns (Empty);
  rpc Unsubscribe(PubSubSubscribeReq) returns (Empty);
  rpc Publish(PubSubPublishReq) returns (Empty);
}

service console {
  rpc Exec(ConsoleInputEvent) returns (stream ConsoleOutputEvent);
}

service proxy {
  rpc List(Empty) returns (ProxyListRes);
  rpc Upsert(ProxyReq) returns (UpsertRes);
  rpc Delete(IdReq) returns (Empty);
}

service ssh {
  rpc List(Empty) returns (SshListRes);
  rpc Test(SshReq) returns (Empty);
  rpc Upsert(SshReq) returns (UpsertRes);
  rpc Delete(IdReq) returns (Empty);
}

service tls {
  rpc List(Empty) returns (TlsListRes);
  rpc Upsert(TlsReq) returns (UpsertRes);
  rpc Delete(IdReq) returns (Empty);
}

service connection {
  rpc List(Empty) returns (ConnectionListRes);
  rpc Upsert(ConnectionReq) returns (UpsertRes);
  rpc Delete(IdReq) returns (Empty);
}

service system {
  rpc Info(Empty) returns (SystemInfoRes);
}

service group {
  rpc List(Empty) returns (GroupListRes);
  rpc Upsert(GroupUpsertReq) returns (UpsertRes);
  rpc Delete(IdReq) returns (Empty);
}

service setting {
  rpc List(Empty) returns (SettingListRes);
  rpc Set(SettingSetReq) returns (Empty);
  rpc Get(SettingGetReq) returns (SettingGetRes);
}

message AnalysisProfileReq {
  string connection_id  = 1;
  int32  database_index = 2;
  string mode           = 3;
  int64  sample_size    = 4;
}

message AnalysisBucket {
  string label = 1; // power-of-two bucket as Redis reports it: "8", "16K"
  int64  count = 2;
}

message AnalysisTypeStat {
  string kind  = 1;
  int64  keys  = 2;
  int64  bytes = 3; // estimated from the sample; 0 when nothing was sampled
}

message AnalysisSizeDistrib {
  string kind             = 1; // strings | lists | hashes | sets | zsets
  string unit             = 2; // bytes | items
  repeated AnalysisBucket buckets = 3;
}

message AnalysisTopKey {
  string key    = 1;
  string kind   = 2;
  int64  bytes  = 3;
  int64  ttl_ms = 4;
  int64  recency = 5;
}

message AnalysisMemory {
  int64  used          = 1;
  int64  peak          = 2;
  int64  dataset       = 3;
  int64  overhead      = 4;
  int64  maxmemory     = 5;
  double fragmentation = 6;
  string policy        = 7;
}

message AnalysisTtlStat {
  int64 total      = 1;
  int64 with_ttl   = 2;
  int64 avg_ttl_ms = 3;
  repeated AnalysisBucket buckets = 4; // sampled, label is a human range
}

message AnalysisNode {
  string addr = 1;
  int64  keys = 2;
}

message AnalysisProfileEvent {
  string phase     = 1;
  int64  scanned   = 2;
  int64  total     = 3;
  bool   truncated = 5;
  repeated string warnings = 6;
  string distrib_source = 7;
  string redis_version  = 8;
  AnalysisMemory  memory = 9;
  AnalysisTtlStat ttl    = 10;
  repeated AnalysisTypeStat    types    = 11;
  repeated AnalysisSizeDistrib distrib  = 12;
  repeated AnalysisTopKey      top_keys = 13;
  repeated AnalysisNode        nodes    = 14;
  string recency_metric = 15; // freq | idle | none
}

service analysis {
  rpc Profile(AnalysisProfileReq) returns (stream AnalysisProfileEvent);
}
